package com.yaddashty.app.ads

import android.app.Activity
import android.content.Context
import android.net.ConnectivityManager
import android.net.NetworkCapabilities
import android.util.Log
import ir.tapsell.plus.AdRequestCallback
import ir.tapsell.plus.AdShowListener
import ir.tapsell.plus.TapsellPlus
import ir.tapsell.plus.TapsellPlusInitListener
import ir.tapsell.plus.model.AdNetworkError
import ir.tapsell.plus.model.AdNetworks
import ir.tapsell.plus.model.TapsellPlusAdModel
import ir.tapsell.plus.model.TapsellPlusErrorModel

object AdManager {
    private var preloadedResponseId: String? = null
    private var isLoading = false

    fun initialize(activity: Activity) {
        TapsellPlus.initialize(activity, TapsellConfig.activeAppKey, object : TapsellPlusInitListener {
            override fun onInitializeSuccess(adNetworks: AdNetworks) {
                if (TapsellConfig.TEST_MODE) {
                    TapsellPlus.setDebugMode(Log.DEBUG)
                }
                preload(activity) // پیش‌بارگذاری خودکار در بدو ورود
            }
            override fun onInitializeFailed(adNetworks: AdNetworks, error: AdNetworkError) {
                Log.e("AdManager", "Init failed: \${error.errorMessage}")
            }
        })
    }

    fun isOnline(context: Context): Boolean {
        val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
        val net = cm.activeNetwork ?: return false
        val caps = cm.getNetworkCapabilities(net) ?: return false
        return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
    }

    fun isAdReady(context: Context): Boolean = isOnline(context) && !preloadedResponseId.isNullOrEmpty()

    // ۳. پیش‌بارگذاری تبلیغ (Preload) تا کاربر منتظر نماند
    fun preload(activity: Activity) {
        if (!isOnline(activity) || isLoading || !preloadedResponseId.isNullOrEmpty()) return
        isLoading = true
        TapsellPlus.requestRewardedVideoAd(
            activity,
            TapsellConfig.activeZoneId,
            object : AdRequestCallback() {
                override fun response(adModel: TapsellPlusAdModel) {
                    super.response(adModel)
                    isLoading = false
                    preloadedResponseId = adModel.responseId
                }
                override fun error(message: String) {
                    isLoading = false
                    preloadedResponseId = null
                }
            }
        )
    }

    // ۱ و ۴ و ۵. نمایش تبلیغ پاداشی و اعطای جایزه فقط در صورت تماشای کامل
    fun showRewarded(
        activity: Activity,
        onReward: () -> Unit,
        onFail: (String) -> Unit
    ) {
        val responseId = preloadedResponseId
        if (!isOnline(activity) || responseId.isNullOrEmpty()) {
            onFail("الان تبلیغی موجود نیست")
            preload(activity)
            return
        }

        var rewardEarned = false
        preloadedResponseId = null

        TapsellPlus.showRewardedVideoAd(
            activity,
            responseId,
            object : AdShowListener() {
                override fun onOpened(adModel: TapsellPlusAdModel) {
                    super.onOpened(adModel)
                }
                override fun onRewarded(adModel: TapsellPlusAdModel) {
                    super.onRewarded(adModel)
                    // فقط وقتی ویدیو کامل دیده شد:
                    rewardEarned = true
                }
                override fun onClosed(adModel: TapsellPlusAdModel) {
                    super.onClosed(adModel)
                    if (rewardEarned) {
                        onReward()
                    } else {
                        // کاربر وسط ویدیو بست -> جایزه نده
                        onFail("ویدیو کامل تماشا نشد؛ جایزه داده نشد.")
                    }
                    preload(activity) // لود تبلیغ بعدی
                }
                override fun onError(errorModel: TapsellPlusErrorModel) {
                    super.onError(errorModel)
                    onFail("الان تبلیغی موجود نیست")
                    preload(activity)
                }
            }
        )
    }
