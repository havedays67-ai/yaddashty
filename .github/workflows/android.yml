name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "releases/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaddashty-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish v1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept licenses and install platforms
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/yaddashty-v1.apk
          SIZE=$(stat -c%s releases/yaddashty-v1.apk)
          SHA=$(sha256sum releases/yaddashty-v1.apk | cut -d' ' -f1)
          BUILT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > releases/build-info.json <<EOF
          {
            "app": "Yaddashty",
            "version": 1,
            "versionName": "1",
            "asset": "yaddashty-v1.apk",
            "sizeBytes": ${SIZE},
            "sha256": "${SHA}",
            "builtAt": "${BUILT}",
            "commit": "${GITHUB_SHA}",
            "runUrl": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          python3 - <<'PY'
          import pathlib, json
          info = json.loads(pathlib.Path("releases/build-info.json").read_text())
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")
          start = "<!-- build-info:start -->"
          end = "<!-- build-info:end -->"
          block = (
              start
              + "\n> 🛠 **آخرین بیلد موفق:** `" + info["builtAt"] + "`  \n"
              + "> 📦 حجم فایل: " + f"{info['sizeBytes']/1048576:.2f}" + " مگابایت · نسخه: **۱**  \n"
              + "> 🔐 SHA-256: `" + info["sha256"] + "`  \n"
              + "> [دانلود مستقیم APK](https://github.com/" + "${GITHUB_REPOSITORY}" + "/releases/latest/download/yaddashty-v1.apk)"
              + "\n" + end
          )
          if start in text and end in text:
              head, tail = text.split(start, 1)
              _, rest = tail.split(end, 1)
              text = head + block + rest
          else:
              text = text + "\n" + block + "\n"
          readme.write_text(text, encoding="utf-8")
          PY
          sed -i "s|\${GITHUB_REPOSITORY}|$GITHUB_REPOSITORY|g" README.md
          cat releases/build-info.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaddashty-v1-apk
          path: releases/yaddashty-v1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: "یادداشتی — نسخهٔ ۱"
          body: |
            ## یادداشتی نسخهٔ ۱

            اپلیکیشن یادداشت آفلاین، فارسی و راست‌به‌چپ.

            **نصب:** فایل `yaddashty-v1.apk` را دانلود و روی گوشی اندروید ۸٫۰+ نصب کنید (اجازهٔ نصب از منابع ناشناس لازم است).

            **امکانات:** ساخت و ویرایش با ذخیرهٔ خودکار، سنجاق، جستجو، برچسب، رنگ کارت، بایگانی، سطل زباله با بازگردانی، تکثیر، اشتراک‌گذاری، پشتیبان JSON و تم روشن/تیره.

            داده‌ها فقط روی دستگاه شما ذخیره می‌شوند؛ برنامه به اینترنت نیاز ندارد.

            - نسخه: ۱ (versionCode 1)
            - حداقل اندروید: 8.0 / API 26
            - SHA-256 در `releases/build-info.json`
          files: releases/yaddashty-v1.apk
          make_latest: true
          draft: false
          prerelease: false
          overwrite_files: true

      - name: Commit APK and build info to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(build): publish Yaddashty v1 APK [skip ci]"
          git push origin HEAD:main
