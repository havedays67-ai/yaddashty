name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "releases/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaddashty-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish Android 8+ Game APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept licenses and install Android platform 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build signed APK (minSdk 26 / Android 8.0+)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release artifact and extract APK signature
        run: |
          set -euo pipefail
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/yaddashty-v1.apk
          SIZE=$(stat -c%s releases/yaddashty-v1.apk)
          SHA=$(sha256sum releases/yaddashty-v1.apk | cut -d' ' -f1)
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -n 1)"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs releases/yaddashty-v1.apk | grep -m1 "certificate SHA-256 digest" | awk -F': ' '{print $2}' || echo "signed-v2-v3")
          BUILT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > releases/build-info.json <<EOF_JSON
          {
            "app": "NeonGalaxyYaddashty",
            "version": 1,
            "versionName": "1",
            "minSdk": 26,
            "targetSdk": 35,
            "asset": "yaddashty-v1.apk",
            "sizeBytes": ${SIZE},
            "sha256": "${SHA}",
            "apkCertSha256": "${CERT_SHA256}",
            "builtAt": "${BUILT}",
            "commit": "${GITHUB_SHA}",
            "runUrl": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF_JSON
          python3 - <<'PY'
          import pathlib, json
          info = json.loads(pathlib.Path("releases/build-info.json").read_text())
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")
          start = "<!-- build-info:start -->"
          end = "<!-- build-info:end -->"
          block = (
              start
              + "\n> 🛠 **آخرین بیلد موفق:** `" + info["builtAt"] + "`  \n"
              + "> 📱 **پشتیبانی اندروید:** اندروید ۸.۰ به بالا (`minSdk 26` / `targetSdk 35`)  \n"
              + "> 📦 **حجم فایل APK:** " + f"{info['sizeBytes']/1048576:.2f}" + " مگابایت · نسخه: **۱**  \n"
              + "> 🔐 **امضای فایل (SHA-256):** `" + info["sha256"] + "`  \n"
              + "> 🔏 **امضای گواهی دیجیتال APK (Cert SHA-256):** `" + info.get("apkCertSha256", "") + "`  \n"
              + "> 📥 **[دانلود مستقیم فایل APK (GitHub Release)](https://github.com/" + "${GITHUB_REPOSITORY}" + "/releases/latest/download/yaddashty-v1.apk)** · **[دانلود مستقیم از شاخه اصلی (Raw APK)](https://github.com/" + "${GITHUB_REPOSITORY}" + "/raw/main/releases/yaddashty-v1.apk)**"
              + "\n" + end
          )
          if start in text and end in text:
              head, tail = text.split(start, 1)
              _, rest = tail.split(end, 1)
              text = head + block + rest
          else:
              text = block + "\n\n" + text
          readme.write_text(text, encoding="utf-8")
          PY
          sed -i "s|\${GITHUB_REPOSITORY}|$GITHUB_REPOSITORY|g" README.md
          cat releases/build-info.json

      - name: Verify APK package and manifest
        run: |
          set -euo pipefail
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -n 1)"
          "$AAPT2" dump badging releases/yaddashty-v1.apk | grep -E "^(package|application-label|sdkVersion|targetSdkVersion)" || true
          "$AAPT2" dump xmltree --file AndroidManifest.xml releases/yaddashty-v1.apk | grep -q "com.yaddashty.app.data.YaddashtyApp" \
            || { echo "Application class is not registered correctly"; exit 1; }
          BADGING="$("$AAPT2" dump badging releases/yaddashty-v1.apk)"
          echo "$BADGING" | grep -q "sdkVersion:'26'" || { echo "minSdk must be 26 (Android 8.0+)"; exit 1; }
          echo "APK manifest and minSdk 26 verified successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaddashty-v1-apk
          path: releases/yaddashty-v1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: "نبرد نئون کهکشانی ۲ بعدی + تپسل پلاس (اندروید ۸+)"
          body: |
            ## 🎮 بازی دو بعدی نبرد نئون کهکشانی + SDK تبلیغات ویدیویی پاداشی تپسل پلاس

            - **پشتیبانی کامل از اندروید ۸.۰ به بالا (`minSdk = 26` / `targetSdk = 35`)**
            - **مجهز به SDK رسمی تپسل پلاس (`ir.tapsell.plus:tapsell-plus-sdk-android:2.3.3`)**
            - **پیش‌بارگذاری خودکار تبلیغ (`Preload`) با `AdManager.kt` و `TapsellConfig.kt`**
            - **دکمه «ببین تا یک جان اضافه بگیر» در صفحه Game Over متصل به `showRewarded(onReward, onFail)`**
          files: releases/yaddashty-v1.apk
          make_latest: true
          draft: false
          prerelease: false
          overwrite_files: true

      - name: Commit APK and build info to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add releases README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(build): publish signed Android 8+ 2D Game + Tapsell APK [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then
              echo "Published APK commit on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "Could not push the APK commit after 5 attempts"
          exit 1
